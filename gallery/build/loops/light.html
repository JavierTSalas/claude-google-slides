<!doctype html>
<!-- Window light through blinds, falling on an arch. Seamless 10 s loop. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 528px; height: 675px; overflow: hidden; background: #f1ebe1; }
  #arch { position: absolute; left: 24px; top: 24px; width: 480px; height: 627px; border-radius: 240px 240px 0 0; overflow: hidden;
          background: linear-gradient(160deg, #efd2ad 0%, #e2b07f 55%, #c98a5c 100%); }
  #blinds { position: absolute; left: -400px; top: -300px; width: 1400px; height: 1400px; filter: blur(6px); transform-origin: 700px 700px;
    background: repeating-linear-gradient(90deg, rgba(96,46,20,0) 0px, rgba(96,46,20,0) 46px, rgba(96,46,20,.34) 58px, rgba(96,46,20,.34) 78px, rgba(96,46,20,0) 90px); }
  #leaf { position: absolute; left: 250px; top: 300px; width: 420px; height: 420px; filter: blur(9px); transform-origin: 380px 420px; opacity: .42; }
  #glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 25%, rgba(255,236,200,.55), rgba(255,236,200,0) 60%); }
</style></head><body>
<div id="arch">
  <div id="blinds"></div>
  <svg id="leaf" viewBox="0 0 420 420"><g fill="#5a2a14">
    <path d="M380 420 C 300 300, 240 240, 120 200 C 200 260, 260 320, 370 420 Z"/>
    <ellipse cx="160" cy="150" rx="90" ry="34" transform="rotate(-30 160 150)"/>
    <ellipse cx="250" cy="110" rx="80" ry="28" transform="rotate(-70 250 110)"/>
    <ellipse cx="90" cy="260" rx="85" ry="30" transform="rotate(10 90 260)"/>
    <ellipse cx="300" cy="230" rx="70" ry="24" transform="rotate(-50 300 230)"/></g></svg>
  <div id="glow"></div>
</div>
<script>
  window.LOOP = { w: 528, h: 675, fps: 5, dur: 10 };
  const shift = 90 / Math.cos(32 * Math.PI / 180); // one stripe period per loop
  window.seek = (t) => {
    document.getElementById("blinds").style.transform = `rotate(-32deg) translateX(${(shift * t) / 10}px)`;
    document.getElementById("leaf").style.transform = `rotate(${4 * Math.sin((2 * Math.PI * t) / 10)}deg)`;
  };
  seek(0);
</script></body></html>
