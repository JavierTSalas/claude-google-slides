<!doctype html>
<!-- Orbit system on warm black. Seamless 12 s loop: every body turns a whole number of times. -->
<html><head><meta charset="utf-8">
<style>
  :root { --ground: #141210; --ink: #eba6bd; --cream: #f1ebe1; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--ground); }
  .ring { fill: none; stroke: var(--ink); stroke-width: 2; }
  .dash { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 2 14; stroke-linecap: round; }
  .pink { fill: var(--ink); } .cream { fill: var(--cream); }
</style></head><body>
<svg width="1280" height="720" viewBox="0 0 1280 720">
  <circle class="ring" cx="930" cy="360" r="132"/><circle class="ring" cx="930" cy="360" r="214"/>
  <circle class="ring" cx="930" cy="360" r="296"/><circle class="ring" cx="930" cy="360" r="400"/>
  <g id="dashring"><circle class="dash" cx="930" cy="360" r="252"/></g>
  <circle class="pink" cx="930" cy="360" r="54"/>
  <g id="o1"><circle class="cream" cx="1062" cy="360" r="11"/></g>
  <g id="o2"><circle class="pink" cx="716" cy="360" r="20"/><circle class="ring" cx="716" cy="360" r="34"/></g>
  <g id="o3"><circle class="pink" cx="930" cy="656" r="8"/></g>
  <g id="o4"><circle class="cream" cx="930" cy="-40" r="26"/></g>
</svg>
<script>
  window.LOOP = { w: 1280, h: 720, fps: 12, dur: 12 };
  const turns = { o1: 2, o2: -1, o3: 1, o4: 1, dashring: -1 };
  window.seek = (t) => {
    for (const [id, n] of Object.entries(turns))
      document.getElementById(id).setAttribute("transform", `rotate(${(360 * n * t) / 12} 930 360)`);
  };
  seek(0);
</script></body></html>
