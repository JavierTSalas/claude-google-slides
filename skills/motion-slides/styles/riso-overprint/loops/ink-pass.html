<!doctype html>
<!-- Two halftone clouds, one per ink. Multiply prints the overprint color where they meet.
     Stepped on the dot grid every 0.5 s, so render at 2 fps: 12 frames, ~150 KB.
     Suggested render: --fps 2 --width 540 --colors 16. Frame 0 is a complete picture. -->
<html lang="en" data-composition-variables='[
  {"id":"bg","type":"color","label":"Paper (must equal the slide background)","default":"#F0EADE"},
  {"id":"accent","type":"color","label":"First ink","default":"#EE3D98"},
  {"id":"accent2","type":"color","label":"Second ink","default":"#006EA7"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      :root { --bg: #F0EADE; --accent: #EE3D98; --accent2: #006EA7; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 720px; height: 720px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 720px; height: 720px; background: var(--bg); }
      svg { position: absolute; inset: 0; }
      .cloud { mix-blend-mode: multiply; }
      #a circle { fill: var(--accent); }
      #b circle { fill: var(--accent2); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="720" data-height="720">
      <svg class="clip" data-start="0" data-duration="6" data-track-index="0" width="720" height="720" viewBox="0 0 720 720">
        <g id="a" class="cloud"></g>
        <g id="b" class="cloud"></g>
      </svg>
    </div>
    <script>
      const vars = window.__hyperframes?.getVariables?.() || {};
      for (const [k, val] of Object.entries(vars)) document.documentElement.style.setProperty("--" + k, val);
      const G = 14, R = 5.4, RAD = 205;
      function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function cloud(id, cx, cy, seed) {
        const r = rng(seed), g = document.getElementById(id), ns = "http://www.w3.org/2000/svg";
        for (let y = G / 2; y < 720; y += G) for (let x = G / 2; x < 720; x += G) {
          const d = Math.hypot(x - cx, y - cy) / RAD;
          const p = d < 0.45 ? 0.97 : d < 1.15 ? Math.max(0, 1 - (d - 0.45) / 0.7) ** 1.6 : 0;
          if (r() < p) { const c = document.createElementNS(ns, "circle"); c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", R); g.appendChild(c); }
        }
      }
      cloud("a", 290, 360, 7);
      cloud("b", 430, 360, 11);
      const tl = gsap.timeline({ paused: true });
      for (let i = 0; i < 12; i++) {
        const d = Math.round(3 * Math.sin((2 * Math.PI * i) / 12));
        const v = Math.round(Math.cos((2 * Math.PI * i) / 12));
        tl.set("#a", { x: -d * G, y: v * G }, i * 0.5);
        tl.set("#b", { x: d * G, y: -v * G }, i * 0.5);
      }
      tl.set({}, {}, 6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
